[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "runenkrieg-tensorflow-benchmark"
version = "0.1.0"
description = "Conventional TensorFlow baselines for TATARUS Runenkrieg"
requires-python = ">=3.10"
dependencies = [
  "tensorflow-cpu==2.21.0",
  "numpy>=2.1,<2.4",
]

[tool.setuptools.packages.find]
include = ["runenkrieg_tf*"]

